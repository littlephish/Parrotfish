[workspace]
resolver = "2"
members = ["ps-identity", "ps-crypto", "ps-protocol", "ps-client", "ps-oldcodecs", "ps-voice", "ps-app"]

[workspace.package]
version = "0.4.1"
edition = "2021"

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
cpal = "0.18"
curve25519-dalek = "4"
eax = "0.5"
gif = "0.14"
num-bigint = "0.4"
p256 = "0.13"
quicklz = "0.3"
rand = "0.8"
rtrb = "0.3"
sha1 = "0.10"
sha2 = "0.10"
slint = "1"
unsafe-libopus = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ps-voice]
opt-level = 2

[profile.release]
lto = true
