name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/dist
      RUSTFLAGS: -C target-feature=+crt-static
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        run: python tools/package_release.py --tag "$env:TAG" --check

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Tests
        run: cargo test --workspace --locked --release

      - name: Inno Setup
        run: |
          $known = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path $known)) {
            choco install innosetup --no-progress -y
          }

      - name: Build and package
        run: python tools/package_release.py --tag "$env:TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $files --clobber
          } else {
            gh release create "$env:TAG" $files --title "PhishSpeak $($env:TAG.TrimStart('v'))" --generate-notes --verify-tag
          }
