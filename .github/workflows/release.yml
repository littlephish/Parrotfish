name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/dist
      RUSTFLAGS: -C target-feature=+crt-static
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version
        run: python tools/package_release.py --tag "$env:TAG" --check

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Tests
        run: python tools/ci_run.py cargo test --workspace --locked --release

      - name: Tests of the updater
        run: python tools/ci_run.py cargo test --locked --manifest-path updater/Cargo.toml

      - name: Inno Setup
        run: |
          $known = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path $known)) {
            choco install innosetup --no-progress -y
          }

      - name: Build and package
        run: python tools/package_release.py --tag "$env:TAG"

      - name: Installer test
        run: python tools/installer_test.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $files --clobber
          } else {
            gh release create "$env:TAG" $files --title "Parrotfish $($env:TAG.TrimStart('v'))" --notes-from-tag --verify-tag
          }

  macos:
    name: Mac installer
    uses: ./.github/workflows/macos.yml
    with:
      tag: ${{ github.ref_name }}

  publish-macos:
    name: Publish the Mac installer
    needs: [release, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: parrotfish-macos
          path: macos

      - name: Publish
        run: |
          gh release upload "$TAG" macos/* --clobber
          note="The Mac installer, Parrotfish-${TAG#v}.pkg, is not signed or notarised by Apple, so macOS refuses to open it at first. Right-click it and choose Open, or open it once and then press Open Anyway under System Settings, Privacy & Security; do the same for Parrotfish in Applications the first time it starts."
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
            *"is not signed or notarised by Apple"*) ;;
            *) gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$body" "$note")" ;;
          esac
